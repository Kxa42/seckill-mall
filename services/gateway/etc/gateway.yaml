server:
  name: "api-gateway"
  port: "8080"
  metrics_port: "9090"
  mode: "debug"

etcd:
  addr: "127.0.0.1:2379"

jwt:
  secret: "" # 推荐通过环境变量 SECKILL_JWT_SECRET 注入

catalog:
  service_name: "catalog-service"
  address: "" # 留空时通过 etcd:///catalog-service 发现

inventory:
  service_name: "inventory-service"
  address: "" # 留空时通过 etcd:///inventory-service 发现

order:
  service_name: "order-service"
  address: "127.0.0.1:51005"

identity:
  service_name: "identity-service"
  address: "127.0.0.1:51001"

cart:
  service_name: "cart-service"
  address: "127.0.0.1:51004"

payment:
  service_name: "payment-service"
  address: "127.0.0.1:51006"

fulfillment:
  service_name: "fulfillment-service"
  address: "127.0.0.1:51007"
