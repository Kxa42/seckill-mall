server:
  name: "api-gateway"
  port: "8080"
  metrics_port: "9090"
  mode: "debug"

etcd:
  addr: "127.0.0.1:2379"

jwt:
  expire: "24h"
  secret: "" # 推荐通过环境变量 SECKILL_JWT_SECRET 注入

commerce:
  url: "http://127.0.0.1:8081"

catalog:
  service_name: "catalog-service"
  address: "" # 留空时通过 etcd://seckill/catalog-service 发现

inventory:
  service_name: "inventory-service"
  address: "" # 第二阶段仅建立客户端，秒杀订单仍由兼容代理处理

order:
  service_name: "order-service"
  address: "127.0.0.1:51005"

identity:
  service_name: "identity-service"
  address: "127.0.0.1:51001"

cart:
  service_name: "cart-service"
  address: "127.0.0.1:51004"

payment:
  service_name: "payment-service"
  address: "127.0.0.1:51006"

fulfillment:
  service_name: "fulfillment-service"
  address: "127.0.0.1:51007"
