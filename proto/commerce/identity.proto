syntax = "proto3";

package commerce.identity.v1;

option go_package = "seckill-mall/common/pb;pb";

message IdentityAddressSnapshotRequest {
  uint64 user_id = 1;
  uint64 address_id = 2;
}

message IdentityAddressSnapshot {
  uint64 address_id = 1;
  uint64 user_id = 2;
  string recipient = 3;
  string phone = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail = 8;
}

service IdentityService {
  rpc GetAddressSnapshot(IdentityAddressSnapshotRequest) returns (IdentityAddressSnapshot);
}
