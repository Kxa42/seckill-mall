syntax = "proto3";

package commerce.inventory.v1;

option go_package = "seckill-mall/common/pb;pb";

message InventoryReserveRequest {
  string reservation_id = 1;
  string order_id = 2;
  uint64 user_id = 3;
  uint64 sku_id = 4;
  int32 quantity = 5;
  string mode = 6;
}

message InventoryReservationResponse {
  string reservation_id = 1;
  string status = 2;
  string message = 3;
}

message InventoryReservationRequest {
  string reservation_id = 1;
  string order_id = 2;
}

message InventorySeckillAdmitRequest {
  string request_id = 1;
  uint64 activity_id = 2;
  uint64 user_id = 3;
  uint64 sku_id = 4;
  int32 quantity = 5;
}

message InventorySeckillAdmitResponse {
  string admission_id = 1;
  string status = 2;
  string message = 3;
}

service InventoryService {
  rpc Reserve(InventoryReserveRequest) returns (InventoryReservationResponse);
  rpc Confirm(InventoryReservationRequest) returns (InventoryReservationResponse);
  rpc Release(InventoryReservationRequest) returns (InventoryReservationResponse);
  rpc AdmitSeckill(InventorySeckillAdmitRequest) returns (InventorySeckillAdmitResponse);
}
