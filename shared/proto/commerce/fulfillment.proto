syntax = "proto3";

package commerce.fulfillment.v1;

option go_package = "seckill-mall/shared/gen/commerce;pb";

message FulfillmentShipRequest {
  uint64 actor_id = 1;
  string order_id = 2;
  string carrier = 3;
  string tracking_no = 4;
}

message FulfillmentShipResponse {
  string shipment_id = 1;
  string status = 2;
  string message = 3;
  string order_id = 4;
  string carrier = 5;
  string tracking_no = 6;
  string order_status = 7;
  bool reused = 8;
}

message FulfillmentConfirmReceiptRequest {
  uint64 user_id = 1;
  string order_id = 2;
}

message FulfillmentGetRequest {
  uint64 user_id = 1;
  string order_id = 2;
}

service FulfillmentService {
  rpc Ship(FulfillmentShipRequest) returns (FulfillmentShipResponse);
  rpc ConfirmReceipt(FulfillmentConfirmReceiptRequest) returns (FulfillmentShipResponse);
  rpc Get(FulfillmentGetRequest) returns (FulfillmentShipResponse);
}
