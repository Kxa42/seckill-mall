syntax = "proto3";

package commerce.identity.v1;

option go_package = "seckill-mall/shared/gen/commerce;pb";

message IdentityAddressSnapshotRequest {
  uint64 user_id = 1;
  uint64 address_id = 2;
}

message IdentityAddressSnapshot {
  uint64 address_id = 1;
  uint64 user_id = 2;
  string recipient = 3;
  string phone = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail = 8;
}

message IdentityUser {
  uint64 id = 1;
  string email = 2;
  string role = 3;
  string status = 4;
}

message IdentityTokenPair {
  string access_token = 1;
  int64 access_expires_at_unix = 2;
  string refresh_token = 3;
  int64 refresh_expires_at_unix = 4;
  IdentityUser user = 5;
}

message IdentityCredentialsRequest {
  string email = 1;
  string password = 2;
}

message IdentityRefreshRequest {
  string refresh_token = 1;
}

message IdentityAddress {
  uint64 id = 1;
  uint64 user_id = 2;
  string recipient = 3;
  string phone = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail = 8;
  bool is_default = 9;
}

message IdentityAddressCreateRequest {
  uint64 user_id = 1;
  IdentityAddress address = 2;
}

message IdentityAddressUpdateRequest {
  uint64 user_id = 1;
  uint64 address_id = 2;
  IdentityAddress address = 3;
}

message IdentityAddressDeleteRequest {
  uint64 user_id = 1;
  uint64 address_id = 2;
}

message IdentityAddressDeleteResponse {
  bool deleted = 1;
}

message IdentityAddressListRequest {
  uint64 user_id = 1;
}

message IdentityAddressListResponse {
  repeated IdentityAddress items = 1;
}

service IdentityService {
  rpc Register(IdentityCredentialsRequest) returns (IdentityTokenPair);
  rpc Login(IdentityCredentialsRequest) returns (IdentityTokenPair);
  rpc Refresh(IdentityRefreshRequest) returns (IdentityTokenPair);
  rpc CreateAddress(IdentityAddressCreateRequest) returns (IdentityAddress);
  rpc UpdateAddress(IdentityAddressUpdateRequest) returns (IdentityAddress);
  rpc DeleteAddress(IdentityAddressDeleteRequest) returns (IdentityAddressDeleteResponse);
  rpc ListAddresses(IdentityAddressListRequest) returns (IdentityAddressListResponse);
  rpc GetAddressSnapshot(IdentityAddressSnapshotRequest) returns (IdentityAddressSnapshot);
}
