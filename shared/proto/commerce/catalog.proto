syntax = "proto3";

package commerce.catalog.v1;

option go_package = "seckill-mall/shared/gen/commerce;pb";

import "google/protobuf/timestamp.proto";

message CatalogGetSKUSnapshotRequest {
  repeated uint64 sku_ids = 1;
  bool include_inactive = 2;
}

message CatalogSKUSnapshot {
  uint64 sku_id = 1;
  uint64 spu_id = 2;
  string sku_code = 3;
  string sku_name = 4;
  int64 price_cents = 5;
  bool active = 6;
  int32 available_stock = 7;
  int32 reserved_stock = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CatalogGetSKUSnapshotResponse {
  repeated CatalogSKUSnapshot items = 1;
}

message CatalogListProductsRequest {
  int32 offset = 1;
  int32 limit = 2;
  bool include_inactive = 3;
}

message CatalogProduct {
  uint64 spu_id = 1;
  uint64 category_id = 2;
  string name = 3;
  string description = 4;
  bool active = 5;
  repeated CatalogSKUSnapshot skus = 6;
  repeated string images = 7;
}

message CatalogListProductsResponse {
  repeated CatalogProduct items = 1;
  int64 total = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message CatalogGetProductRequest {
  uint64 spu_id = 1;
  bool include_inactive = 2;
}

service CatalogService {
  rpc ListProducts(CatalogListProductsRequest) returns (CatalogListProductsResponse);
  rpc GetProduct(CatalogGetProductRequest) returns (CatalogProduct);
  rpc GetSKUSnapshot(CatalogGetSKUSnapshotRequest) returns (CatalogGetSKUSnapshotResponse);
}
