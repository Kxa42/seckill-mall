global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'commerce-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['commerce-api:8081']

  - job_name: 'product-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['product-service:9091']

  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:9092']

  - job_name: 'mq-consumer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mq-consumer:9093']

  - job_name: 'outbox-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['outbox-worker:9095']

  - job_name: 'dlq-consumer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['dlq-consumer:9094']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']
